<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #333;
            margin: 0;
            font-size: 24px;
        }
        
        .logo p {
            color: #666;
            margin: 5px 0 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        .error-message {
            background: #fed7d7;
            color: #742a2a;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
        
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔐 管理员登录</h1>
            <p>智能电商购物助手数据后台</p>
        </div>
        
        <div id="errorMessage" class="error-message">
            用户名或密码错误
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="请输入用户名" 
                    value="admin"
                    required
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="请输入密码" 
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <div class="remember">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">记住我（7天）</label>
            </div>
            
            <button type="submit">登录</button>
        </form>
        
        <div class="info">
            <p>默认用户名: <strong>admin</strong></p>
            <p>密码请查看环境变量 <code>ADMIN_PASSWORD</code></p>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // 隐藏之前的错误信息
            document.getElementById('errorMessage').style.display = 'none';
            
            try {
                // 创建Basic Auth头
                const credentials = btoa(`${username}:${password}`);
                
                // 尝试访问受保护的页面
                const response = await fetch('/admin', {
                    headers: {
                        'Authorization': `Basic ${credentials}`
                    }
                });
                
                if (response.ok) {
                    // 保存登录状态到本地存储（可选）
                    if (rememberMe) {
                        localStorage.setItem('admin_auth', credentials);
                        localStorage.setItem('admin_auth_expire', 
                            Date.now() + 7 * 24 * 60 * 60 * 1000); // 7天后过期
                    } else {
                        sessionStorage.setItem('admin_auth', credentials);
                    }
                    
                    // 重定向到管理后台
                    window.location.href = '/admin';
                } else {
                    showError('用户名或密码错误');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('网络错误，请重试');
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // 页面加载时检查是否有保存的凭据
        document.addEventListener('DOMContentLoaded', function() {
            // 检查sessionStorage
            let credentials = sessionStorage.getItem('admin_auth');
            
            // 如果没有，检查localStorage（记住我）
            if (!credentials) {
                credentials = localStorage.getItem('admin_auth');
                const expireTime = localStorage.getItem('admin_auth_expire');
                
                // 检查是否过期
                if (expireTime && Date.now() > parseInt(expireTime)) {
                    localStorage.removeItem('admin_auth');
                    localStorage.removeItem('admin_auth_expire');
                    credentials = null;
                }
            }
            
            // 如果有保存的凭据，自动登录
            if (credentials) {
                fetch('/admin', {
                    headers: { 'Authorization': `Basic ${credentials}` }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/admin';
                    }
                })
                .catch(() => {
                    // 清除无效的凭据
                    sessionStorage.removeItem('admin_auth');
                    localStorage.removeItem('admin_auth');
                    localStorage.removeItem('admin_auth_expire');
                });
            }
        });
        
        // 支持回车键提交
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.activeElement.id === 'password') {
                document.getElementById('loginForm').requestSubmit();
            }
        });
    </script>
</body>
</html>
